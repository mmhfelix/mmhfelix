<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VTC 數3 熱血操練場</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />

<style>
  html, body { margin: 0; padding: 0; height: 100%; background: var(--canvas-bg, #F2EBD8); transition: background 0.4s; }
  body { font-family: 'Noto Sans TC', system-ui, sans-serif; color: #14110F; }

  .stage {
    min-height: 100vh; padding: 40px 24px 80px;
    display: flex; flex-direction: column; align-items: center; gap: 36px;
  }
  .deck-row {
    display: flex; gap: 32px; align-items: flex-start;
    flex-wrap: wrap; justify-content: center;
  }
  .deck-header { text-align: center; max-width: 720px; }
  .deck-eyebrow {
    font-family: ui-monospace, 'SF Mono', Menlo, monospace;
    font-size: 11px; letter-spacing: 3px; text-transform: uppercase;
    color: #D63A1A;
  }
  .deck-title {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 800; font-size: 44px; line-height: 0.95; letter-spacing: -1.5px;
    margin: 6px 0 8px;
  }
  .deck-sub { font-family: 'Noto Sans TC', sans-serif; font-size: 14px; color: #3A3530; }

  @keyframes hf-confetti-fall {
    0%   { transform: translate(var(--x, 0), 0) rotate(0deg); opacity: 1; }
    100% { transform: translate(calc(var(--x, 0) * 3), 200px) rotate(720deg); opacity: 0; }
  }
  @keyframes hf-slide-up {
    0%   { transform: translateY(100%); }
    100% { transform: translateY(0); }
  }

  /* ── VIBE ─────────────────────────────────────────────────── */
  body.vibe-marker { --canvas-bg: #1B3A2E; }
  body.vibe-marker .deck-title  { color: #FAF6EE; }
  body.vibe-marker .deck-sub    { color: #C8E0CB; }
  body.vibe-marker .deck-eyebrow{ color: #F5E844; }

  body.vibe-neon { --canvas-bg: #0E0B14; }
  body.vibe-neon .deck-title  { color: #FAF6EE; text-shadow: 0 0 18px #FF5A36; }
  body.vibe-neon .deck-sub    { color: #C0B8FF; }
  body.vibe-neon .deck-eyebrow{ color: #F5E844; }
  body.vibe-neon .hf-phone-frame { box-shadow: 0 0 24px #FF5A36, 8px 8px 0 0 #14110F !important; }

  /* ── ENERGY ───────────────────────────────────────────────── */
  body.energy-hyped .hf-phone-frame { animation: hf-shake 0.6s ease-in-out infinite alternate; }
  body.energy-calm  .hf-phone-frame { animation: none !important; }
  @keyframes hf-shake {
    0%   { transform: rotate(-0.3deg) translate(-1px, 0); }
    100% { transform: rotate( 0.3deg) translate( 1px, -1px); }
  }

  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>

// hifi-kit.jsx — Hi-fi shōnen/manga primitives shared across all 3 screens
// Vibes: sketch (default coral+paper), marker (chalkboard), neon (electric).
// Energy: calm / default / hyped (more shake, sparkle, speed-lines).

const HF = {
  // Core palette
  coral: '#FF5A36',
  coralDeep: '#D63A1A',
  coralSoft: '#FFE2D8',
  ink: '#14110F',
  inkSoft: '#3A3530',
  paper: '#FAF6EE',
  paperWarm: '#F2EBD8',
  pencil: '#7C746C',
  ghost: '#C8C0B6',
  electric: '#F5E844',     // dark-horse: electric yellow
  oilBlue: '#1B4FE0',
  // Type
  display: "'Bricolage Grotesque', 'Noto Serif TC', sans-serif",
  body: "'Noto Sans TC', system-ui, sans-serif",
  shout: "'Caveat', 'Kalam', cursive",
  mono: "ui-monospace, 'SF Mono', Menlo, monospace",
};

// ─── Halftone dot pattern (used as accent texture) ─────────────────
function HFHalftone({ color = HF.ink, size = 3, gap = 7, opacity = 0.35, style = {} }) {
  const id = React.useMemo(() => 'ht' + Math.random().toString(36).slice(2, 8), []);
  return (
    <svg style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', pointerEvents: 'none', opacity, ...style }}>
      <defs>
        <pattern id={id} x="0" y="0" width={gap} height={gap} patternUnits="userSpaceOnUse">
          <circle cx={gap / 2} cy={gap / 2} r={size / 2} fill={color} />
        </pattern>
      </defs>
      <rect width="100%" height="100%" fill={`url(#${id})`} />
    </svg>
  );
}

// ─── Speed lines (manga radial action lines) ───────────────────────
function HFSpeedLines({ color = HF.ink, count = 28, opacity = 0.7, style = {} }) {
  const lines = React.useMemo(() => Array.from({ length: count }, (_, i) => {
    const a = (i / count) * Math.PI * 2 + Math.random() * 0.05;
    const r1 = 90 + Math.random() * 10;
    const r2 = 50 + Math.random() * 35;
    return { x1: 50 + Math.cos(a) * r1, y1: 50 + Math.sin(a) * r1,
             x2: 50 + Math.cos(a) * r2, y2: 50 + Math.sin(a) * r2,
             w: 0.8 + Math.random() * 1.4 };
  }), [count]);
  return (
    <svg viewBox="0 0 100 100" preserveAspectRatio="none"
      style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', pointerEvents: 'none', opacity, ...style }}>
      {lines.map((l, i) => (
        <line key={i} x1={l.x1} y1={l.y1} x2={l.x2} y2={l.y2} stroke={color} strokeWidth={l.w} strokeLinecap="round" />
      ))}
    </svg>
  );
}

// ─── Burst / starburst (BAM-style speech callout) ──────────────────
function HFBurst({ children, color = HF.electric, ink = HF.ink, points = 14, size = 130, rotate = -8, style = {}, onClick }) {
  const path = React.useMemo(() => {
    const r1 = 50, r2 = 38;
    let d = '';
    for (let i = 0; i < points * 2; i++) {
      const r = i % 2 === 0 ? r1 : r2;
      const a = (i / (points * 2)) * Math.PI * 2 - Math.PI / 2;
      const x = 50 + Math.cos(a) * r;
      const y = 50 + Math.sin(a) * r;
      d += (i === 0 ? 'M' : 'L') + x.toFixed(1) + ',' + y.toFixed(1) + ' ';
    }
    return d + 'Z';
  }, [points]);
  return (
    <div onClick={onClick} style={{
      position: 'relative', width: size, height: size,
      transform: `rotate(${rotate}deg)`, cursor: onClick ? 'pointer' : 'default',
      display: 'inline-flex', alignItems: 'center', justifyContent: 'center', ...style,
    }}>
      <svg viewBox="0 0 100 100" style={{ position: 'absolute', inset: 0, width: '100%', height: '100%' }}>
        <path d={path} fill={color} stroke={ink} strokeWidth="2.5" strokeLinejoin="miter" />
      </svg>
      <div style={{
        position: 'relative', textAlign: 'center', fontFamily: HF.display, fontWeight: 800,
        color: ink, lineHeight: 0.9, padding: '0 12px',
      }}>{children}</div>
    </div>
  );
}

// ─── Tilted stamp box (for badges, "L1", "GO") ────────────────────
function HFStamp({ children, color = HF.coral, ink = HF.paper, rotate = -4, size = 'md', style = {} }) {
  const sizes = { sm: { p: '4px 8px', f: 12 }, md: { p: '6px 12px', f: 16 }, lg: { p: '10px 18px', f: 22 } };
  const s = sizes[size];
  return (
    <span style={{
      display: 'inline-block', padding: s.p, background: color, color: ink,
      fontFamily: HF.display, fontWeight: 800, fontSize: s.f, letterSpacing: 0.5,
      transform: `rotate(${rotate}deg)`, border: `2.5px solid ${HF.ink}`,
      boxShadow: `3px 3px 0 0 ${HF.ink}`, ...style,
    }}>{children}</span>
  );
}

// ─── Heavy button with offset shadow ──────────────────────────────
function HFBtn({ children, primary, dark, full, size = 'md', onClick, disabled, style = {} }) {
  const sizes = {
    sm: { p: '8px 14px', f: 13, h: 36 },
    md: { p: '12px 20px', f: 15, h: 48 },
    lg: { p: '16px 24px', f: 18, h: 56 },
  };
  const s = sizes[size];
  const bg = disabled ? HF.ghost : primary ? HF.coral : dark ? HF.ink : HF.paper;
  const fg = disabled ? HF.pencil : primary ? HF.paper : dark ? HF.electric : HF.ink;
  const [pressed, setPressed] = React.useState(false);
  return (
    <button
      onClick={disabled ? undefined : onClick}
      onPointerDown={() => setPressed(true)}
      onPointerUp={() => setPressed(false)}
      onPointerLeave={() => setPressed(false)}
      style={{
        appearance: 'none', cursor: disabled ? 'not-allowed' : 'pointer',
        padding: s.p, minHeight: s.h, width: full ? '100%' : 'auto',
        background: bg, color: fg,
        fontFamily: HF.display, fontWeight: 800, fontSize: s.f, letterSpacing: 0.3,
        border: `2.5px solid ${HF.ink}`,
        boxShadow: pressed ? `1px 1px 0 0 ${HF.ink}` : `4px 4px 0 0 ${HF.ink}`,
        transform: pressed ? 'translate(3px, 3px)' : 'translate(0, 0)',
        transition: 'transform 0.08s ease, box-shadow 0.08s ease',
        display: 'inline-flex', alignItems: 'center', justifyContent: 'center', gap: 6,
        ...style,
      }}
    >{children}</button>
  );
}

// ─── Heavy card with offset shadow ────────────────────────────────
function HFCard({ children, accent, dark, padding = 16, radius = 18, style = {}, onClick }) {
  return (
    <div
      onClick={onClick}
      style={{
        position: 'relative',
        background: accent ? HF.coralSoft : dark ? HF.ink : HF.paper,
        color: dark ? HF.paper : HF.ink,
        border: `2.5px solid ${HF.ink}`,
        borderRadius: radius,
        boxShadow: `5px 5px 0 0 ${HF.ink}`,
        padding,
        cursor: onClick ? 'pointer' : 'default',
        ...style,
      }}
    >{children}</div>
  );
}

// ─── Section heading: tiny eyebrow + huge display ──────────────────
function HFTitle({ eyebrow, children, size = 32, style = {} }) {
  return (
    <div style={style}>
      {eyebrow && (
        <div style={{
          fontFamily: HF.mono, fontSize: 11, letterSpacing: 2, textTransform: 'uppercase',
          color: HF.coralDeep, marginBottom: 4,
        }}>{eyebrow}</div>
      )}
      <div style={{
        fontFamily: HF.display, fontWeight: 800, fontSize: size, lineHeight: 0.95,
        letterSpacing: -0.5, color: HF.ink,
      }}>{children}</div>
    </div>
  );
}

// ─── Phone frame (clean iOS-y bezel) ───────────────────────────────
function HFPhone({ children, w = 360, h = 720, label, style = {} }) {
  return (
    <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 10, ...style }}>
      <div className="hf-phone-frame" style={{
        width: w, height: h,
        background: HF.paper,
        border: `2.5px solid ${HF.ink}`,
        borderRadius: 36,
        boxShadow: `8px 8px 0 0 ${HF.ink}`,
        overflow: 'hidden',
        position: 'relative',
      }}>
        {/* status bar */}
        <div style={{
          height: 36, padding: '0 22px', display: 'flex', alignItems: 'center', justifyContent: 'space-between',
          fontFamily: HF.display, fontWeight: 700, fontSize: 13, color: HF.ink,
        }}>
          <span>9:41</span>
          <span style={{ display: 'flex', gap: 4, alignItems: 'center' }}>
            <span style={{ fontFamily: HF.mono, fontSize: 10 }}>●●●</span>
          </span>
        </div>
        <div style={{ height: h - 36, overflow: 'hidden', position: 'relative' }}>{children}</div>
      </div>
      {label && (
        <div style={{ fontFamily: HF.mono, fontSize: 11, color: HF.pencil, letterSpacing: 1, textTransform: 'uppercase' }}>{label}</div>
      )}
    </div>
  );
}

// ─── Confetti burst (one-shot) ────────────────────────────────────
function HFConfetti({ active }) {
  const pieces = React.useMemo(() => Array.from({ length: 24 }, () => ({
    x: (Math.random() - 0.5) * 100,
    y: -Math.random() * 60 - 10,
    r: Math.random() * 360,
    c: [HF.coral, HF.electric, HF.ink, HF.oilBlue][Math.floor(Math.random() * 4)],
    d: 0.4 + Math.random() * 0.6,
  })), [active]);
  if (!active) return null;
  return (
    <div style={{ position: 'absolute', inset: 0, pointerEvents: 'none', overflow: 'hidden' }}>
      {pieces.map((p, i) => (
        <div key={i} style={{
          position: 'absolute', left: '50%', top: '40%',
          width: 8, height: 12, background: p.c,
          border: `1.5px solid ${HF.ink}`,
          transform: `translate(${p.x * 3}px, ${p.y * 3}px) rotate(${p.r}deg)`,
          animation: `hf-confetti-fall ${p.d + 1.4}s ease-out forwards`,
        }} />
      ))}
    </div>
  );
}

// Mascot character — 火柴人/圓臉 evolved into a confident manga sphere
function HFMascot({ mood = 'pumped', size = 80, rotate = -4 }) {
  const expressions = {
    pumped:  { eyes: '◣ ◢', mouth: 'M30 70 Q50 88 70 70', cheek: true },
    happy:   { eyes: '＾ ＾', mouth: 'M30 68 Q50 82 70 68', cheek: false },
    think:   { eyes: '◔ ◔', mouth: 'M35 75 L65 75', cheek: false },
    sad:     { eyes: 'T T', mouth: 'M30 78 Q50 65 70 78', cheek: false },
    fire:    { eyes: '◆ ◆', mouth: 'M30 70 Q50 90 70 70', cheek: true },
  };
  const e = expressions[mood] || expressions.pumped;
  return (
    <div style={{ width: size, height: size, transform: `rotate(${rotate}deg)`, position: 'relative', flexShrink: 0 }}>
      <svg viewBox="0 0 100 100" style={{ width: '100%', height: '100%' }}>
        <circle cx="50" cy="50" r="42" fill={HF.electric} stroke={HF.ink} strokeWidth="3" />
        {e.cheek && <>
          <circle cx="22" cy="62" r="6" fill={HF.coral} stroke={HF.ink} strokeWidth="1.5" />
          <circle cx="78" cy="62" r="6" fill={HF.coral} stroke={HF.ink} strokeWidth="1.5" />
        </>}
        <text x="50" y="55" textAnchor="middle" fontSize="18" fontWeight="800" fontFamily={HF.display} fill={HF.ink}>{e.eyes}</text>
        <path d={e.mouth} fill="none" stroke={HF.ink} strokeWidth="3" strokeLinecap="round" />
        {/* tuft of hair */}
        <path d="M30 18 Q40 5 50 14 Q60 4 72 18" fill={HF.ink} />
      </svg>
    </div>
  );
}

Object.assign(window, { HF, HFHalftone, HFSpeedLines, HFBurst, HFStamp, HFBtn, HFCard, HFTitle, HFPhone, HFConfetti, HFMascot });

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', noDeckControls = false, children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  // Auto-inject a rail toggle when a <deck-stage> is on the page. The
  // toggle drives the deck's per-viewer _railVisible via window message;
  // state is mirrored from the same localStorage key the deck reads so
  // the control reflects reality across reloads. The mechanism is the
  // message — authors who want custom placement can post it directly
  // and pass noDeckControls to suppress this one.
  const hasDeckStage = React.useMemo(
    () => typeof document !== 'undefined' && !!document.querySelector('deck-stage'),
    [],
  );
  // Hide the toggle until the host has actually enabled the rail (the
  // __omelette_rail_enabled window message, posted only when the
  // omelette_deck_rail_enabled flag is on for this user). The initial read
  // covers TweaksPanel mounting after the message already arrived; the
  // listener covers the common case of mounting first.
  const [railEnabled, setRailEnabled] = React.useState(
    () => hasDeckStage && !!document.querySelector('deck-stage')?._railEnabled,
  );
  React.useEffect(() => {
    if (!hasDeckStage || railEnabled) return undefined;
    const onMsg = (e) => {
      if (e.data && e.data.type === '__omelette_rail_enabled') setRailEnabled(true);
    };
    window.addEventListener('message', onMsg);
    return () => window.removeEventListener('message', onMsg);
  }, [hasDeckStage, railEnabled]);
  const [railVisible, setRailVisible] = React.useState(() => {
    try { return localStorage.getItem('deck-stage.railVisible') !== '0'; } catch (e) { return true; }
  });
  const toggleRail = (on) => {
    setRailVisible(on);
    window.postMessage({ type: '__deck_rail_visible', on }, '*');
  };
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-noncommentable=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
          {hasDeckStage && railEnabled && !noDeckControls && (
            <TweakSection label="Deck">
              <TweakToggle label="Thumbnail rail" value={railVisible} onChange={toggleRail} />
            </TweakSection>
          )}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {

}

function TweakRow({ label, value, children, inline = false }) {

      <div className="twk-lbl">
        <span>{label}</span>

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}

}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

// ── Helpers ───────────────────────────────────────────────────
function randInt(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

// Display formatter: proper minus sign, no change for positives
function fmtN(n) {
  return n < 0 ? '−' + Math.abs(n) : String(n);
}

function fmtPt(label, x, y) {
  return label + ' ( ' + fmtN(x) + ', ' + fmtN(y) + ' )';
}

// ── Question generation ───────────────────────────────────────
const Q_SEQUENCE = [
  { type: 'slope',    p1: 'A', p2: 'B' },
  { type: 'distance', p1: 'P', p2: 'Q' },
  { type: 'midpoint', p1: 'E', p2: 'F' },
  { type: 'slope',    p1: 'C', p2: 'D' },
  { type: 'distance', p1: 'R', p2: 'S' },
  { type: 'midpoint', p1: 'G', p2: 'H' },
];

function generateQuestions() {
  return Q_SEQUENCE.map(({ type, p1, p2 }, idx) => {
    let x1, y1, x2, y2, tries = 0;
    do {
      x1 = randInt(-8, 8); y1 = randInt(-8, 8);
      x2 = randInt(-8, 8); y2 = randInt(-8, 8);
      tries++;
    } while (
      tries < 300 && (
        (x1 === x2 && y1 === y2) ||
        (type === 'slope' && x1 === x2)
      )
    );

    let answers, zh, en, pts, hintNote;

    if (type === 'slope') {
      const a = y2 - y1, b = x2 - x1;
      answers = { a, b };
      zh = '求 ' + p1 + ' 與 ' + p2 + ' 的斜率';
      en = 'Find the slope of ' + p1 + ' and ' + p2;
      pts = fmtPt(p1, x1, y1) + '   ' + fmtPt(p2, x2, y2);
      hintNote = '分子 numerator 係 y 的差，分母 denominator 係 x 的差。' +
        p2 + '(' + fmtN(y2) + ') − ' + p1 + '(' + fmtN(y1) + ') = ' + fmtN(a) +
        '，' + p2 + '(' + fmtN(x2) + ') − ' + p1 + '(' + fmtN(x1) + ') = ' + fmtN(b);
    } else if (type === 'distance') {
      const dx = x2 - x1, dy = y2 - y1;
      answers = { dx, dy };
      zh = '求 ' + p1 + ' 與 ' + p2 + ' 的距離';
      en = 'Find the distance between ' + p1 + ' and ' + p2;
      pts = fmtPt(p1, x1, y1) + '   ' + fmtPt(p2, x2, y2);
      hintNote = '橫距 = ' + fmtN(x2) + ' − (' + fmtN(x1) + ') = ' + Math.abs(dx) +
        '，直距 = ' + fmtN(y2) + ' − (' + fmtN(y1) + ') = ' + Math.abs(dy);
    } else {
      const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
      answers = { mx, my };
      zh = '求 ' + p1 + ' 與 ' + p2 + ' 的中點 M';
      en = 'Find the midpoint M of ' + p1 + ' and ' + p2;
      pts = fmtPt(p1, x1, y1) + ' 和 ' + fmtPt(p2, x2, y2);
      hintNote = 'x 坐標 = (' + fmtN(x1) + ' + ' + fmtN(x2) + ') \xf7 2 = ' + mx +
        '，y 坐標 = (' + fmtN(y1) + ' + ' + fmtN(y2) + ') \xf7 2 = ' + my;
    }

    return {
      id: idx + 1, type, xp: 20,
      topicZh: { slope: '斜率', distance: '距離', midpoint: '中點' }[type],
      topicEn: { slope: 'Slope', distance: 'Distance', midpoint: 'Midpoint' }[type],
      p1, p2, x1, y1, x2, y2,
      answers, zh, en, pts, hintNote,
    };
  });
}

// ── Validation ────────────────────────────────────────────────
// Safe eval for simple arithmetic expressions (distance dynamic check)
function evalSafe(input) {
  const s = String(input || '').trim().replace(/[−–]/g, '-').replace(/\s/g, '');
  if (!s || !/^[0-9+\-*/().]+$/.test(s)) return null;
  try {
    const v = new Function('return (' + s + ')')();
    return (typeof v === 'number' && isFinite(v)) ? v : null;
  } catch (_) { return null; }
}

function checkDistanceVal(input, expectedDiff) {
  const v = evalSafe(input);
  return v !== null && Math.abs(v) === Math.abs(expectedDiff);
}

// Pattern matching for midpoint: exact decimal OR (a+b)/2 form
function checkMidpointVal(input, v1, v2) {
  const expected = (v1 + v2) / 2;
  const s = String(input || '').trim().replace(/[−–]/g, '-').replace(/\s/g, '');
  if (!s) return false;

  // Pattern 1: exact numeric value
  const num = parseFloat(s);
  if (!isNaN(num) && num === expected) {
    if (Number.isInteger(expected)) return s === String(Math.round(expected)); // reject "2.0"
    return s === String(expected); // e.g. "2.5"
  }

  // Pattern 2: (a+b)/2 — normalise inner parens around negatives first
  const norm = s.replace(/\((-?\d+)\)/g, '$1');
  const m = norm.match(/^\((-?\d+)\+(-?\d+)\)\/2$/);
  if (m) {
    const a = parseInt(m[1], 10), b = parseInt(m[2], 10);
    return (a === v1 && b === v2) || (a === v2 && b === v1);
  }
  return false;
}

function checkQuestion(q, vals) {
  const norm = (s) => String(s || '').trim().replace(/[−–]/g, '-');
  if (q.type === 'slope') {
    return norm(vals.a) === String(q.answers.a) && norm(vals.b) === String(q.answers.b);
  }
  if (q.type === 'distance') {
    return checkDistanceVal(vals.dx, q.answers.dx) && checkDistanceVal(vals.dy, q.answers.dy);
  }
  if (q.type === 'midpoint') {
    return checkMidpointVal(vals.mx, q.x1, q.x2) && checkMidpointVal(vals.my, q.y1, q.y2);
  }
  return false;
}

function isComplete(q, vals) {
  const keys = { slope: ['a','b'], distance: ['dx','dy'], midpoint: ['mx','my'] };
  return (keys[q.type] || []).every((k) => !!(vals[k] || '').trim());
}

// ── HFFillBox ─────────────────────────────────────────────────
function HFFillBox({ value, setValue, stage, checkFn, placeholder, disabled }) {
  const isCorrect = stage === 'correct';
  const isWrong   = stage === 'wrong' && checkFn && !checkFn(value);
  const bg     = isCorrect ? HF.electric : isWrong ? HF.coralSoft : HF.paper;
  const border = isWrong ? HF.coralDeep : HF.ink;
  return (
    <input
      inputMode="decimal"
      value={value}
      disabled={disabled}
      onChange={(e) => setValue(e.target.value)}
      placeholder={placeholder}
      style={{
        appearance: 'none',
        width: 64, height: 44, textAlign: 'center',
        background: bg, color: HF.ink,
        border: '2.5px solid ' + border,
        boxShadow: '3px 3px 0 0 ' + HF.ink,
        borderRadius: 10,
        fontFamily: HF.display, fontWeight: 800, fontSize: 20,
        outline: 'none', caretColor: HF.coral,
      }}
    />
  );
}

// ── QuestionBody ──────────────────────────────────────────────
function QuestionBody({ q, vals, setVals, stage }) {
  const set = (key) => (v) => setVals((prev) => ({ ...prev, [key]: v }));
  const dis = stage !== 'practice';
  const mono9 = { fontFamily: HF.mono, fontSize: 9, letterSpacing: 1, color: HF.pencil };

  if (q.type === 'slope') {
    return (
      <div style={{
        marginTop: 14, display: 'flex', alignItems: 'center', justifyContent: 'center',
        gap: 12, fontFamily: HF.display, fontWeight: 800, fontSize: 22, color: HF.ink,
        whiteSpace: 'nowrap',
      }}>
        <span style={{ flexShrink: 0 }}>m =</span>
        <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 6, flexShrink: 0 }}>
          <HFFillBox value={vals.a || ''} setValue={set('a')} stage={stage} disabled={dis}
            checkFn={(v) => String(v||'').trim().replace(/[−–]/g,'-') === String(q.answers.a)}
            placeholder="?" />
          <div style={{ height: 3, width: 86, background: HF.ink, borderRadius: 2 }} />
          <HFFillBox value={vals.b || ''} setValue={set('b')} stage={stage} disabled={dis}
            checkFn={(v) => String(v||'').trim().replace(/[−–]/g,'-') === String(q.answers.b)}
            placeholder="?" />
        </div>
      </div>
    );
  }

  if (q.type === 'distance') {
    return (
      <div style={{ marginTop: 14, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 8 }}>
        <div style={{ display: 'flex', alignItems: 'flex-end', justifyContent: 'center', gap: 10,
          fontFamily: HF.display, fontWeight: 800, fontSize: 18, color: HF.ink }}>
          {/* 橫距 */}
          <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 3 }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 2 }}>
              <span>(</span>
              <HFFillBox value={vals.dx || ''} setValue={set('dx')} stage={stage} disabled={dis}
                checkFn={(v) => checkDistanceVal(v, q.answers.dx)} placeholder="?" />
              <span>)²</span>
            </div>
            <span style={mono9}>橫距</span>
          </div>
          <span style={{ paddingBottom: 22 }}>+</span>
          {/* 直距 */}
          <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 3 }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 2 }}>
              <span>(</span>
              <HFFillBox value={vals.dy || ''} setValue={set('dy')} stage={stage} disabled={dis}
                checkFn={(v) => checkDistanceVal(v, q.answers.dy)} placeholder="?" />
              <span>)²</span>
            </div>
            <span style={mono9}>直距</span>
          </div>
        </div>
        <div style={{ fontFamily: HF.body, fontSize: 11, color: HF.pencil }}>
          d = √( 橫距² + 直距² )
        </div>
      </div>
    );
  }

  if (q.type === 'midpoint') {
    return (
      <div style={{ marginTop: 14, display: 'flex', alignItems: 'flex-end', justifyContent: 'center',
        gap: 8, fontFamily: HF.display, fontWeight: 800, fontSize: 18, color: HF.ink }}>
        <span style={{ paddingBottom: 20 }}>M = (</span>
        <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 3 }}>
          <HFFillBox value={vals.mx || ''} setValue={set('mx')} stage={stage} disabled={dis}
            checkFn={(v) => checkMidpointVal(v, q.x1, q.x2)} placeholder="x" />
          <span style={mono9}>x 坐標</span>
        </div>
        <span style={{ paddingBottom: 20 }}>,</span>
        <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 3 }}>
          <HFFillBox value={vals.my || ''} setValue={set('my')} stage={stage} disabled={dis}
            checkFn={(v) => checkMidpointVal(v, q.y1, q.y2)} placeholder="y" />
          <span style={mono9}>y 坐標</span>
        </div>
        <span style={{ paddingBottom: 20 }}>)</span>
      </div>
    );
  }
  return null;
}

// ── HintLine ──────────────────────────────────────────────────
function HintLine({ q }) {
  if (q.type === 'slope') {
    return (
      <div style={{ marginTop: 10, textAlign: 'center', fontFamily: HF.body, fontSize: 11,
        color: HF.pencil, display: 'flex', alignItems: 'center', justifyContent: 'center',
        gap: 6, flexWrap: 'wrap' }}>
        <span>提示 Hint：m =</span>
        <HFFrac top={<span>y₂ − y₁</span>} bottom={<span>x₂ − x₁</span>} size={11} color={HF.pencil} />
      </div>
    );
  }
  if (q.type === 'distance') {
    return (
      <div style={{ marginTop: 10, textAlign: 'center', fontFamily: HF.body, fontSize: 11, color: HF.pencil }}>
        提示 Hint：可以填數值或算式，例如 4−1
      </div>
    );
  }
  if (q.type === 'midpoint') {
    return (
      <div style={{ marginTop: 10, textAlign: 'center', fontFamily: HF.body, fontSize: 11,
        color: HF.pencil, display: 'flex', alignItems: 'center', justifyContent: 'center',
        gap: 4, flexWrap: 'wrap' }}>
        <span>提示 Hint：M = (</span>
        <HFFrac top={<span>x₁+x₂</span>} bottom={<span>2</span>} size={10} color={HF.pencil} />
        <span>,</span>
        <HFFrac top={<span>y₁+y₂</span>} bottom={<span>2</span>} size={10} color={HF.pencil} />
        <span>)</span>
      </div>
    );
  }
  return null;
}

// ── AnswerBox ─────────────────────────────────────────────────
function AnswerBox({ q }) {
  const a = q.answers;
  if (q.type === 'slope') {
    return (
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8, flexWrap: 'wrap' }}>
        <span>正解 Answer：m =</span>
        <HFFrac
          top={<span style={{ color: HF.coralDeep }}>{fmtN(a.a)}</span>}
          bottom={<span style={{ color: HF.coralDeep }}>{fmtN(a.b)}</span>}
          size={13}
        />
      </div>
    );
  }
  if (q.type === 'distance') {
    return (
      <span>
        正解 Answer：橫距 = <b style={{ color: HF.coralDeep }}>{Math.abs(a.dx)}</b>，
        直距 = <b style={{ color: HF.coralDeep }}>{Math.abs(a.dy)}</b>
      </span>
    );
  }
  if (q.type === 'midpoint') {
    return (
      <span>
        正解 Answer：M = (<b style={{ color: HF.coralDeep }}>{a.mx}</b>, <b style={{ color: HF.coralDeep }}>{a.my}</b>)
      </span>
    );
  }
  return null;
}

// ── P3Hifi ────────────────────────────────────────────────────
function P3Hifi({ onBack }) {
  const [questions]    = React.useState(() => generateQuestions());
  const [tab, setTab]  = React.useState('slope');
  const [qIdx, setQIdx] = React.useState(0);
  const [stage, setStage] = React.useState('practice'); // practice | correct | wrong
  const [vals, setVals]   = React.useState({});
  const [xpTotal, setXpTotal] = React.useState(0);
  const [showConfetti, setShowConfetti] = React.useState(false);
  const [showPass, setShowPass] = React.useState(false);

  const q       = questions[qIdx];
  const isLast  = qIdx === questions.length - 1;
  const pct     = ((qIdx + (stage === 'correct' ? 1 : 0)) / questions.length) * 100;

  // Auto-switch teach tab to match current question type
  React.useEffect(() => { setTab(q.type); }, [qIdx]);

  const tabObj = P3_TEACH_TABS.find((t) => t.id === tab);

  const submit = () => {
    if (checkQuestion(q, vals)) {
      setStage('correct');
      setXpTotal((x) => x + q.xp);
      setShowConfetti(true);
      setTimeout(() => setShowConfetti(false), 1800);
    } else {
      setStage('wrong');
    }
  };

  const retry = () => { setVals({}); setStage('practice'); };

  const nextQ = () => {
    if (isLast) { setShowPass(true); }
    else { setQIdx((i) => i + 1); setVals({}); setStage('practice'); }
  };

  return (
    <HFPhone w={360} h={780} label="操練 A · 距離 / 斜率 / 中點">
      {showPass && <PassScreen xpTotal={xpTotal} onBack={onBack} />}

      {/* Nav + progress */}
      <div style={{ padding: '12px 18px 8px', display: 'flex', alignItems: 'center', gap: 10 }}>
        <button onClick={onBack} style={{
          appearance: 'none', cursor: 'pointer',
          background: HF.paper, border: '2.5px solid ' + HF.ink,
          width: 36, height: 36, borderRadius: 10,
          fontFamily: HF.display, fontWeight: 800, fontSize: 16,
          boxShadow: '3px 3px 0 0 ' + HF.ink, flexShrink: 0,
        }}>←</button>
        <div style={{ flex: 1, height: 14, background: HF.paper,
          border: '2.5px solid ' + HF.ink, borderRadius: 999, overflow: 'hidden' }}>
          <div style={{ width: pct + '%', height: '100%', background: HF.coral,
            transition: 'width 0.5s cubic-bezier(.5,1.6,.4,1)' }} />
        </div>
        <div style={{ fontFamily: HF.mono, fontSize: 11, color: HF.ink, fontWeight: 700, flexShrink: 0 }}>
          {qIdx + (stage === 'correct' ? 1 : 0)} / 6
        </div>
      </div>

      {/* Teach tabs */}
      <div style={{ padding: '8px 18px 12px' }}>
        <div style={{ display: 'flex', gap: 6, background: HF.ink, padding: 4,
          border: '2.5px solid ' + HF.ink, borderRadius: 12 }}>
          {P3_TEACH_TABS.map((t) => (
            <button key={t.id} onClick={() => setTab(t.id)} style={{
              flex: 1, appearance: 'none', cursor: 'pointer',
              padding: '8px 6px', borderRadius: 8, border: 'none',
              background: tab === t.id ? HF.electric : 'transparent',
              color: tab === t.id ? HF.ink : HF.paper,
              fontFamily: HF.display, fontWeight: 800, fontSize: 13,
              outline: (q.type === t.id && tab !== t.id) ? '2px solid ' + HF.coral : 'none',
              outlineOffset: -2,
            }}>{t.label}</button>
          ))}
        </div>
        <div style={{ marginTop: 10, padding: '12px 14px',
          background: HF.paperWarm, border: '2.5px solid ' + HF.ink, borderRadius: 12,
          boxShadow: '3px 3px 0 0 ' + HF.ink }}>
          <div style={{ fontFamily: HF.mono, fontSize: 9, letterSpacing: 1.5, color: HF.coralDeep }}>
            {tabObj.label} · {tabObj.en.toUpperCase()} · 公式 FORMULA
          </div>
          <div style={{ fontFamily: HF.display, fontWeight: 700, fontSize: 17, color: HF.ink, marginTop: 6, lineHeight: 1.3 }}>
            {tabObj.formula}
          </div>
          <div style={{ fontFamily: HF.body, fontSize: 11, color: HF.inkSoft, marginTop: 6 }}>
            {tabObj.note}
          </div>
        </div>
      </div>

      {/* Question card */}
      <div style={{ padding: '4px 18px' }}>
        <div style={{
          position: 'relative', overflow: 'hidden',
          background: HF.paper, border: '2.5px solid ' + HF.ink, borderRadius: 18,
          boxShadow: '5px 5px 0 0 ' + HF.ink, padding: '16px 16px 18px',
        }}>
          <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between' }}>
            <div style={{ fontFamily: HF.mono, fontSize: 10, letterSpacing: 2, color: HF.coralDeep }}>
              QUESTION {qIdx + 1} / 6
            </div>
            <HFStamp color={HF.electric} ink={HF.ink} rotate={-4} size="sm">
              {q.topicEn.toUpperCase()}
            </HFStamp>
          </div>
          <div style={{ fontFamily: HF.display, fontWeight: 700, fontSize: 16, color: HF.ink, marginTop: 8, lineHeight: 1.3 }}>
            {q.zh}
            <span style={{ display: 'block', fontFamily: HF.body, fontWeight: 500, fontSize: 11, color: HF.pencil, marginTop: 2 }}>
              {q.en}
            </span>
          </div>
          <div style={{
            marginTop: 10, padding: '10px 12px',
            background: HF.coralSoft, border: '2px dashed ' + HF.coralDeep,
            borderRadius: 10, fontFamily: HF.display, fontWeight: 800, fontSize: 17,
            color: HF.ink, textAlign: 'center', letterSpacing: 0.5,
          }}>
            {q.pts}
          </div>

          <QuestionBody q={q} vals={vals} setVals={setVals} stage={stage} />

          {stage === 'practice' && <HintLine q={q} />}

          {stage === 'practice' && (
            <div style={{ marginTop: 16 }}>
              <HFBtn primary full size="lg" onClick={submit} disabled={!isComplete(q, vals)}>
                送出 ⚡
              </HFBtn>
            </div>
          )}
        </div>
      </div>

      {stage === 'correct' && (
        <FeedbackCorrect q={q} qIdx={qIdx} xpTotal={xpTotal} isLast={isLast} onNext={nextQ} />
      )}
      {stage === 'wrong' && <FeedbackWrong q={q} onRetry={retry} />}

      <HFConfetti active={showConfetti} />
    </HFPhone>
  );
}
